name: Android CI Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Agile Pricing & Logic Verification Tests
        run: python3 test_app_logic.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Debug and Release APKs
        env:
          OCTOPUS_BASE_URL: https://api.oegb-kraken.energy
          OCTOPUS_DEFAULT_PRODUCT: AGILE-24-10-01
          OCTOPUS_DEFAULT_REGION: C
        run: |
          gradle assembleDebug assembleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk ./app-release.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agile-watcher-debug-apk
          path: app-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agile-watcher-release-apk
          path: app-release.apk

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-debug.apk
            app-release.apk
          generate_release_notes: true
